<section style="margin:0 12px 22px;text-align:center;font-family:微软雅黑,'Microsoft YaHei',sans-serif;">
    <section style="text-align:center;margin-bottom:14px;">
        <section style="display:inline-block;background:#d4af37;color:#1f232b;font-size:16px;letter-spacing:2px;padding:5px 24px;border-radius:22px;font-weight:bold;">
            {idx}　{title}
        </section>
    </section>
    <section style="background:#262b35;border:1px solid #3a4150;border-radius:10px;padding:14px;">
        <section style="margin-bottom:12px;">
            <img src="{url}" style="display:block;width:100%;height:auto;border-radius:6px;"/>
        </section>
        <section style="font-size:14px;color:#d6d9e0;letter-spacing:1.5px;line-height:1.9;text-align:justify;">
            {idx}、{detail}
        </section>
    </section>
</section>
