<section style="margin:0 12px 26px;text-align:center;font-family:微软雅黑,'Microsoft YaHei',sans-serif;">
    <section style="text-align:center;margin-bottom:16px;">
        <section style="display:inline-block;background:#2b2b2b;color:#fff;font-size:16px;letter-spacing:3px;padding:5px 26px;border-radius:2px;font-weight:bold;">
            {idx}　{title}
        </section>
    </section>
    <section style="background:#ffffff;border:1px solid #e3ddcf;border-radius:4px;padding:16px;">
        <section style="margin-bottom:14px;">
            <img src="{url}" style="display:block;width:100%;height:auto;border-radius:3px;"/>
        </section>
        <section style="font-size:14px;color:#333333;letter-spacing:1.5px;line-height:2;text-align:justify;">
            {idx}、{detail}
        </section>
    </section>
</section>
